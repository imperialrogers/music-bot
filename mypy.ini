[mypy]
# Type checking configuration for bxh-music-bot
# Some error codes remain disabled due to Discord.py's complex type system
# and remaining issues that require more extensive refactoring

python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = False
warn_no_return = True
warn_unreachable = True
strict_equality = True
ignore_missing_imports = False

# Disabled error codes:
# - union-attr, arg-type: Discord.py returns many union types that are complex to narrow
# - attr-defined: Some dynamic attributes and Discord.py API complexity
# - assignment, call-arg, return-value: Complex type mismatches requiring extensive refactoring
# - method-assign, override: Discord.py callback patterns
# - misc, index, typeddict-item, func-returns-value, no-redef: Various edge cases
disable_error_code = union-attr,arg-type,attr-defined,assignment,call-arg,misc,return-value,index,typeddict-item,method-assign,override,func-returns-value,no-redef

# Ignore missing imports for third-party libraries
[mypy-discord.*]
ignore_missing_imports = True

[mypy-yt_dlp.*]
ignore_missing_imports = True

[mypy-aiohttp.*]
ignore_missing_imports = True

[mypy-lyricsgenius.*]
ignore_missing_imports = True

[mypy-spotipy.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True

[mypy-cachetools.*]
ignore_missing_imports = True

[mypy-playwright.*]
ignore_missing_imports = True

[mypy-spotify_scraper.*]
ignore_missing_imports = True

[mypy-syncedlyrics.*]
ignore_missing_imports = True

# Bot modules - lenient type checking due to complex Discord.py interactions
[mypy-src.bxh_music_bot.*]
# Don't ignore errors, but be lenient
warn_return_any = False
warn_unreachable = False
allow_untyped_calls = True
allow_untyped_defs = True
allow_incomplete_defs = True

# i18n translator - stricter checking
[mypy-src.i18n_translator]
warn_return_any = False
allow_untyped_calls = True

; Made with Bob
